<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PropFS</title>
  <!--
    Halaman ini nyaris tidak pernah terlihat.

    Capacitor mewajibkan `webDir` berisi sesuatu, tetapi selama `server.url`
    menunjuk ke https://propfs.id, WebView langsung membuka situsnya dan
    halaman ini dilewati. Ia baru muncul bila `server.url` dicabut suatu hari
    nanti — dan pada saat itu, yang membaca layar ini berhak tahu kenapa
    aplikasinya tidak menampilkan apa-apa.

    Yang PENTING dari berkas ini justru apa yang TIDAK ada di dalamnya:
    tidak ada hasil `npm run build`, jadi tidak ada satu pun VITE_* dan tidak
    ada kunci Supabase yang ikut terpaket ke dalam APK yang dibagikan orang.
    Membangun APK karena itu tidak memerlukan rahasia apa pun.
  -->
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #0D1B2A; color: #E7ECF3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      height: 100%; display: grid; place-content: center; justify-items: center;
      gap: 18px; padding: 32px; text-align: center;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
    svg { width: 84px; height: 84px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .01em; }
    p { margin: 0; max-width: 30ch; font-size: 13px; line-height: 1.6; color: #94A3B8; }
    a {
      margin-top: 6px; display: inline-block; text-decoration: none;
      background: #C9A84C; color: #0D1B2A; font-weight: 800; font-size: 14px;
      padding: 12px 26px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="1024" height="1024" rx="232" fill="#0D1B2A"/>
      <path fill="#C9A84C" fill-rule="evenodd"
            d="M300 250h250a165 165 0 0 1 0 330H410v200H300z
               M410 360v110h140a55 55 0 0 0 0-110z"/>
    </svg>
    <h1>Membuka PropFS…</h1>
    <p>
      Aplikasi ini memuat PropFS langsung dari internet, jadi datanya selalu
      yang terbaru. Pastikan HP Anda tersambung ke jaringan.
    </p>
    <a href="https://propfs.id">Buka propfs.id</a>
  </main>
</body>
</html>
